<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Git</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <div class="where">
          <button id="switcher" class="switcher-btn" aria-haspopup="dialog" aria-expanded="false" title="Switch project or worktree (Ctrl/Cmd+K)">
            <span class="proj"></span><span class="wt"></span><span class="chev" data-icon="chevronDown"></span>
          </button>
          <span id="branchChip" class="branch-chip hidden"></span>
        </div>
        <span class="spacer"></span>
        <span id="busy" class="spinner hidden" title="Working…" role="status" aria-label="Working"></span>
        <div class="sync" role="group" aria-label="Sync">
          <button class="icon" data-act="fetch" title="Fetch all remotes" aria-label="Fetch" data-icon="fetch"></button>
          <button class="icon" data-act="pull" title="Update (pull)" aria-label="Update" data-icon="pull"></button>
          <button class="icon" data-act="push" title="Push…" aria-label="Push" data-icon="push"></button>
        </div>
        <button class="icon" data-act="newBranch" title="New branch…" aria-label="New branch" data-icon="plus"></button>
        <button class="icon" data-act="refresh" title="Refresh" aria-label="Refresh" data-icon="refresh"></button>
      </header>
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="log" role="tab">Log</button>
        <button class="tab" data-tab="changes" role="tab">Changes<span id="changesCount" class="count"></span></button>
      </nav>
      <div id="banner" class="banner hidden"></div>

      <main id="logView" class="view">
        <aside id="branchesPane" class="pane">
          <div class="search">
            <span data-icon="search"></span>
            <input id="branchFilter" placeholder="Branch or tag" spellcheck="false" />
          </div>
          <div id="branchTree" class="tree" tabindex="0"></div>
        </aside>
        <div class="splitter" data-split="branches"></div>
        <section id="logPane" class="pane">
          <div class="filters">
            <button class="icon" id="toggleBranches" title="Branches" data-icon="branch"></button>
            <div class="search grow">
              <span data-icon="search"></span>
              <input id="textFilter" placeholder="Text or hash" spellcheck="false" />
            </div>
            <select id="branchSelect" title="Branch"></select>
            <select id="userSelect" title="User"><option value="">User</option></select>
            <select id="dateSelect" title="Date">
              <option value="">Date</option>
              <option value="24 hours ago">Last 24 hours</option>
              <option value="7 days ago">Last 7 days</option>
              <option value="30 days ago">Last 30 days</option>
              <option value="1 year ago">Last year</option>
            </select>
          </div>
          <div id="rows" class="rows" tabindex="0"></div>
        </section>
        <div class="splitter" data-split="details"></div>
        <section id="detailsPane" class="pane">
          <div class="empty"><strong>No commit selected</strong>Pick a commit in the log to see its message and changed files.</div>
        </section>
      </main>

      <main id="changesView" class="view hidden">
        <section id="changesPane" class="pane">
          <div id="changesList" class="changes"></div>
          <div class="commit-box">
            <div class="message">
              <textarea id="commitMessage" placeholder="Summary of the change&#10;&#10;Optional details after a blank line" spellcheck="true" aria-label="Commit message"></textarea>
              <span id="subjectHint" class="subject-hint"></span>
            </div>
            <div class="commit-actions">
              <label><input type="checkbox" id="amend" /> Amend last commit</label>
              <div class="commit-buttons">
                <button id="commitPushBtn">Commit and push</button>
                <button id="commitBtn" class="primary" title="Ctrl/Cmd+Enter">Commit</button>
              </div>
            </div>
          </div>
        </section>
        <div class="splitter" data-split="changes"></div>
        <section id="changesDiff" class="pane">
          <div class="empty"><strong>No file selected</strong>Pick a file to see its diff.</div>
        </section>
      </main>

      <div id="switcherPop" class="switcher hidden" role="dialog" aria-label="Switch project or worktree">
        <div class="search">
          <span data-icon="search"></span>
          <input id="switcherFilter" placeholder="Find a project, worktree or branch" spellcheck="false" autocomplete="off" />
        </div>
        <div id="switcherList" class="switcher-list" role="listbox"></div>
        <div class="switcher-foot">
          <label><input type="checkbox" id="followFocus" checked /> Follow the workspace open in Orca</label>
          <span class="keys">Enter shows Git, Shift+Enter also opens it in Orca</span>
        </div>
      </div>
      <div id="mergeView" class="merge hidden" role="region" aria-label="Merge conflicts"></div>
      <div id="conflictsModal" class="modal hidden"></div>
      <div id="menu" class="menu hidden" role="menu"></div>
      <div id="modal" class="modal hidden"></div>
      <div id="toasts" class="toasts"></div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
